name: TTS Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'episodes/**'
      - '.github/workflows/tts-preview.yml'
      - 'scripts/xfyun-tools/**'

concurrency:
  group: tts-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          python -m pip install --upgrade pip
          python -m pip install websocket-client

      - name: Resolve canonical and voice profile
        id: inputs
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          mapfile -t TEXT_FILES < <(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- 'episodes/*.txt')
          if [ "${#TEXT_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one changed canonical episode text; found ${#TEXT_FILES[@]}"
            printf '%s\n' "${TEXT_FILES[@]}"
            exit 1
          fi
          TEXT_FILE="${TEXT_FILES[0]}"
          test -f "$TEXT_FILE" || { echo "Canonical text does not exist: $TEXT_FILE"; exit 1; }
          STEM=$(basename "$TEXT_FILE" .txt)
          PROFILE_FILE="episodes/${STEM}.profile"
          PROFILE=default
          if [ -f "$PROFILE_FILE" ]; then
            PROFILE=$(tr -d '[:space:]' < "$PROFILE_FILE")
          fi
          case "$PROFILE" in
            default|science) ;;
            *) echo "Invalid voice profile: $PROFILE"; exit 1 ;;
          esac
          echo "text_file=$TEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "output_name=${STEM}-preview.mp3" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Resolved canonical: $TEXT_FILE"
          echo "Resolved profile: $PROFILE"

      - name: Validate build-only inputs
        shell: bash
        run: |
          test -n "$XFYUN_APPID" || { echo "Missing XFYUN_APPID"; exit 1; }
          test -n "$XFYUN_API_KEY" || { echo "Missing XFYUN_API_KEY"; exit 1; }
          test -n "$XFYUN_API_SECRET" || { echo "Missing XFYUN_API_SECRET"; exit 1; }
          test -f "${{ steps.inputs.outputs.text_file }}" || { echo "Missing canonical text file"; exit 1; }
          mkdir -p build

      - name: Generate segmented TTS preview
        run: |
          python scripts/xfyun-tools/xfyun_segmented_run.py \
            --text-file "${{ steps.inputs.outputs.text_file }}" \
            --out "build/${{ steps.inputs.outputs.output_name }}" \
            --profile "${{ steps.inputs.outputs.profile }}" \
            --pause-ms 350

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-preview-${{ github.sha }}
          path: build/${{ steps.inputs.outputs.output_name }}
          if-no-files-found: error
          retention-days: 7
